# Windows x86_64 build: MSYS2 UCRT64 -> dist/ -> zip + Inno Setup installer.
# Tags v* also publish a GitHub Release with both files.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # release on tags

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-rs
            mingw-w64-ucrt-x86_64-libnice
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^project(streamline VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            v="${GITHUB_REF_NAME#v}"
            # Release tags must match project(VERSION) (a -rc.N style suffix is allowed).
            if [[ "${v%%-*}" != "$base" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt version $base"
              exit 1
            fi
          else
            v="$base-ci.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=${v%%-*}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$v" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Streamline $v"

      - name: Build and package dist/
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTREAMLINE_VERSION="${{ steps.version.outputs.version }}"
          cmake --build build
          cmake --install build --prefix dist
          bash tools/collect-licenses.sh dist

      - name: Check package
        run: |
          # Only Windows on PATH: a DLL missing from dist/ must fail here, not load from MSYS2.
          export PATH=/c/Windows/system32:/c/Windows
          ./dist/bin/streamline.exe --check-package
          # Runners have no AMD GPU / audio device: report, don't fail.
          ./dist/bin/streamline.exe --check || echo "::warning::--check reported missing runtime elements (expected without GPU/audio)"

      - name: Installer and zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DNumericVersion=${{ steps.version.outputs.numeric }}" packaging\streamline.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\* -DestinationPath "build\installer\Streamline-${{ steps.version.outputs.version }}-win64.zip"
          Get-ChildItem build\installer

      - uses: actions/upload-artifact@v7
        with:
          name: streamline-${{ steps.version.outputs.version }}-win64
          path: build/installer/*

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${{ steps.version.outputs.numeric }}"
          awk -v hdr="## [$v]" 'index($0, hdr) == 1 {f=1; next} /^## \[/ {f=0} /^\[.*\]: http/ {f=0} f' \
            CHANGELOG.md > build/release-notes.md
          if [[ ! -s build/release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [$v]"
            exit 1
          fi
          cat build/release-notes.md

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Streamline ${{ steps.version.outputs.version }}
          body_path: build/release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: build/installer/*
